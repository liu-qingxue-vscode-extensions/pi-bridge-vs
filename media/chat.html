<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  CSP（内容安全策略）：
    default-src 'none'       —— 默认禁止一切外部资源
    style-src {{cspSource}} 'unsafe-inline'  —— 允许 VS Code 注入的样式 + 内联 <style>
    script-src 'nonce-{{nonce}}'             —— 只允许带本次 nonce 的脚本执行
  {{nonce}} / {{cspSource}} 由扩展在加载时注入（html-loader.ts）
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<style>
  /* ===== 可调参数（CSS 变量）=====
     这些是默认值；扩展会从 VS Code 设置生成覆盖（留空 = 用这里/主题变量）*/
  :root {
    --pi-bubble-width: 88%;
    --pi-bubble-radius: 6px;
    --pi-bubble-padding: 8px 12px;

    /* 气泡之间的竖直间距（挂 margin-top，不叠加）*/
    --pi-gap-turn: 10px;
    --pi-gap-user-first: 12px;
    --pi-gap-thinking-text: 4px;
    --pi-gap-thinking-tool: 4px;
    --pi-gap-text-tool: 6px;
    --pi-gap-tool-text: 4px;
    --pi-gap-tool-thinking: 4px;
    --pi-gap-text-thinking: 4px;

    --pi-rail-width: 2px;
    --pi-border-w: 1px;
  }
  /* ★ 设置覆盖注入点（带 :root { ... }，在默认值之后 → 同优先级覆盖 ✓）*/
{{styleVars}}

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size);
    color: var(--vscode-editor-foreground);
    background: var(--vscode-sideBar-background);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    /* ★ 用 flex 纵向布局：靠左/靠右用 align-self —— 比 margin:auto 可靠得多 */
    display: flex;
    flex-direction: column;
    align-items: flex-start;   /* 默认靠左 */
  }

  /* ===== 气泡（每个内容段 = 一个气泡）=====
     ★ 间距只用 margin-top（相邻兄弟），避免和 margin-bottom 叠加 */
  .bubble {
    width: var(--pi-bubble-width, 88%);   /* AI 气泡：固定宽度（流式无法预测）*/
    padding: var(--pi-bubble-padding, 8px 12px);
    border-radius: var(--pi-bubble-radius, 6px);
    /* ★ 默认透明：各类型自己指定背景，避免“改一处动全部” */
    background: transparent;
    border: var(--pi-border-w, 1px) solid var(--pi-border-bubble, transparent);
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* 默认间距（相邻气泡之间）*/
  .bubble + .bubble { margin-top: var(--pi-gap-turn, 10px); }

  /* ---- 用户消息：靠右 + 【自适应宽度】（不固定）---- */
  .bubble.user {
    align-self: flex-end;                     /* ★ 可靠右对齐 */
    width: auto;                              /* 内容多宽就多宽 */
    min-width: var(--pi-user-min-width, 48px); /* 短消息不会缩成一条线 */
    max-width: var(--pi-bubble-width, 88%);   /* 超过上限就换行 */
    background: var(--pi-bg-user, var(--vscode-button-background));
    color: var(--vscode-button-foreground);
    border-color: var(--pi-border-user, var(--pi-border-bubble, transparent));
  }
  /* 用户消息 → AI 第一个气泡（覆盖默认间距）*/
  .bubble.user + .bubble { margin-top: var(--pi-gap-user-first, 12px); }

  /* ---- 思考气泡 ---- */
  .bubble.thinking {
    background: var(--pi-bg-thinking, transparent);
    border-left: var(--pi-rail-width, 2px) solid
      var(--pi-rail-color-thinking, var(--vscode-panel-border));
    color: var(--vscode-descriptionForeground);
    font-style: italic;
    font-size: 0.95em;
  }  .bubble.thinking::before {
    content: "思考";
    display: block;
    font-style: normal;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.6;
    margin-bottom: 2px;
  }

  /* ---- 正文气泡 ---- */
  .bubble.text {
    background: var(--pi-bg-text, var(--vscode-textBlockQuote-background));
  }

  /* ---- 工具气泡：外框 + 上下两部分（调用 / 结果），中间无线 ----
     ★ 一个外框画出全部四条边 → 视觉上是【一个】气泡 ✓
     ★ overflow: hidden → 内部背景被外框圆角裁剪 ✓ */
  .bubble.tool {
    padding: 0;
    overflow: hidden;
    background: transparent;
    border: var(--pi-border-w, 1px) solid var(--pi-border-tool, var(--vscode-panel-border));
    border-left: var(--pi-rail-width, 2px) solid
      var(--pi-rail-color-tool, var(--vscode-charts-orange));
  }
  .bubble.tool .tool-call,
  .bubble.tool .tool-result {
    padding: 6px 12px;
    font-family: var(--vscode-editor-font-family, monospace);
    font-size: 0.9em;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .bubble.tool .tool-call {
    background: var(--pi-bg-tool-call, var(--vscode-textBlockQuote-background));
  }
  .bubble.tool .tool-head {
    color: var(--vscode-charts-orange);
    margin-bottom: 3px;
  }
  .bubble.tool .tool-result {
    background: var(--pi-bg-tool-result, var(--vscode-textBlockQuote-background));
    max-height: 220px;
    overflow-y: auto;
  }
  .bubble.tool .tool-result::before {
    content: "结果";
    display: block;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.65;
    color: var(--vscode-charts-orange);
    margin-bottom: 3px;
  }
  .bubble.tool .tool-result.error::before { content: "结果（出错）"; color: var(--vscode-charts-red); }

  /* ===== 气泡之间的间距（按【前 → 后】分别控制；只写 margin-top，不叠加）===== */
  .bubble.thinking + .bubble.text { margin-top: var(--pi-gap-thinking-text, 4px); }
  .bubble.thinking + .bubble.tool { margin-top: var(--pi-gap-thinking-tool, 4px); }
  .bubble.text + .bubble.tool { margin-top: var(--pi-gap-text-tool, 6px); }
  .bubble.tool + .bubble.text { margin-top: var(--pi-gap-tool-text, 4px); }
  .bubble.tool + .bubble.thinking { margin-top: var(--pi-gap-tool-thinking, 4px); }
  .bubble.text + .bubble.thinking { margin-top: var(--pi-gap-text-thinking, 4px); }

  /* ===== 输入区 ===== */
  #input-area {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--vscode-panel-border);
    background: var(--vscode-sideBar-background);
  }
  #input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--vscode-input-border);
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    resize: none;
    outline: none;
  }
  #input:focus { border-color: var(--vscode-focusBorder); }
  #send {
    padding: 6px 16px;
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
  }
  #send:hover { background: var(--vscode-button-hoverBackground); }
</style>
</head>
<body>
  <div id="messages"></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="输入 prompt... (Enter 发送, Shift+Enter 换行)"></textarea>
    <button id="send">发送</button>
  </div>

  <script nonce="{{nonce}}">
    const vscode = acquireVsCodeApi();
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // ===== 渲染模型 =====
    // 【每个内容段 = 一个独立气泡】(user / thinking / text / tool)
    // 工具气泡比较特殊：上半 = 调用，下半 = 结果（结果来自另一条消息，用 callId 找回）
    let currentRole = "assistant";   // 当前消息的角色（决定对齐）
    let currentBubble = null;        // 当前正在流式追加的气泡元素

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createBubble(kind) {
      const div = document.createElement("div");
      div.className = "bubble " + kind;
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    /** 追加文本到"当前气泡"（thinking / text）；类型变了就新建气泡 */
    function appendSegment(kind, text) {
      if (!currentBubble || !currentBubble.classList.contains(kind)) {
        currentBubble = createBubble(kind);
      }
      currentBubble.textContent += text;   // textContent：免疫 HTML 注入
      scrollToBottom();
    }

    /** 新建工具气泡（外框 + 上半调用 + 下半结果占位）*/
    function createToolBubble(callId, toolName) {
      const div = document.createElement("div");
      div.className = "bubble tool";
      div.dataset.callId = callId;

      const call = document.createElement("div");
      call.className = "tool-call";
      const head = document.createElement("div");
      head.className = "tool-head";
      head.textContent = "🔧 " + (toolName || "tool");
      const args = document.createElement("div");
      args.className = "tool-args";
      call.appendChild(head);
      call.appendChild(args);

      div.appendChild(call);
      messagesEl.appendChild(div);
      currentBubble = div;
      scrollToBottom();
      return div;
    }

    /** 把工具结果填回对应的工具气泡（跨消息关联）*/
    function fillToolResult(callId, text, isError) {
      const bubble = messagesEl.querySelector('.bubble.tool[data-call-id="' + callId + '"]');
      if (!bubble) return false;
      let result = bubble.querySelector(".tool-result");
      if (!result) {
        result = document.createElement("div");
        result.className = "tool-result";
        bubble.appendChild(result);
      }
      if (isError) result.classList.add("error");
      result.textContent = text;   // 注意：::before 是伪元素，不影响 textContent
      scrollToBottom();
      return true;
    }

    // ===== 发送：前端 -> 扩展宿主 =====
    function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      vscode.postMessage({ kind: "prompt", text });
      inputEl.value = "";
    }
    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // ===== 应用样式变量（设置变化时由宿主推送）=====
    function applyStyleVars(vars) {
      const root = document.documentElement;
      const names = [];
      for (let i = 0; i < root.style.length; i++) names.push(root.style[i]);
      for (const n of names) {
        if (n.startsWith("--pi-")) root.style.removeProperty(n);
      }
      for (const [k, v] of Object.entries(vars ?? {})) {
        root.style.setProperty(k, v);
      }
    }

    // ===== 接收宿主消息 =====
    window.addEventListener("message", (event) => {
      const data = event.data ?? {};

      if (data.kind === "styleVars") {
        applyStyleVars(data.payload);
        return;
      }

      if (data.kind === "snapshot") {
        // 全量重放（webview 重建后恢复画面）
        messagesEl.innerHTML = "";
        currentBubble = null;
        for (const b of data.payload) {
          currentRole = b.role;
          // ★ 用户消息：整条消息就是一个 user 气泡（不走 segment 逻辑）
          if (b.role === "user") {
            const el = createBubble("user");
            el.textContent = b.blocks.map((x) => x.text).join("");
            currentBubble = null;
            continue;
          }
          let last = null;
          for (const blk of b.blocks) {
            if (blk.type === "tool") {
              last = createToolBubble(blk.toolCallId || "", blk.toolName);
              last.querySelector(".tool-args").textContent = blk.text;
              if (blk.result !== undefined) {
                fillToolResult(blk.toolCallId || "", blk.result, blk.resultIsError === true);
              }
            } else {
              if (!last || last.dataset.seg !== blk.type) {
                last = createBubble(blk.type);   // thinking / text
                last.dataset.seg = blk.type;
              }
              last.textContent += blk.text;
            }
            currentBubble = last;
          }
        }
        scrollToBottom();
        return;
      }

      if (data.kind === "patch") {
        const p = data.payload;
        if (p.kind === "startBubble") {
          currentRole = p.role;
          currentBubble = null;                 // 等第一个段到来时再建
          if (p.role === "user" && p.text) {
            // ★ 你的消息：直接建一个 user 气泡（样式、对齐、宽度都靠 .bubble.user）
            const el = createBubble("user");
            el.textContent = p.text;
            currentBubble = el;
          }
        } else if (p.kind === "append") {
          appendSegment(p.block, p.text);
        } else if (p.kind === "endBubble") {
          currentBubble = null;
        } else if (p.kind === "toolStart") {
          createToolBubble(p.callId, p.name);
        } else if (p.kind === "toolArgs") {
          if (currentBubble) currentBubble.querySelector(".tool-args").textContent += p.text;
          scrollToBottom();
        } else if (p.kind === "toolEnd") {
          /* 参数拼装完成（目前无额外动作）*/
        } else if (p.kind === "toolResult") {
          fillToolResult(p.callId, p.text, p.isError);
        }
      }
    });

    // 通知宿主：webview 已就绪 → 请求重放快照
    vscode.postMessage({ kind: "ready" });
  </script>
</body>
</html>
