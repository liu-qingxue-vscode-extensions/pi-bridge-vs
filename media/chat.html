<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            padding: 10px;
            font-family: sans-serif;
        }
        #output {
            margin-top: 10px;
            padding: 10px;
            background: #222;
            color: #0f0;
        }
    </style>
</head>
<body>
    <h2>Pi 会话</h2>
    <div id="output">等待消息...</div>

    <script>
        const vscode = acquireVsCodeApi();

        // ① 接收后端消息
        window.addEventListener("message", (event) => {
            const msg = event.data;   // { kind, payload }
            const out = document.getElementById("output");
            out.textContent += "\\n[收到] " + msg.kind + ": " + JSON.stringify(msg.payload);
        });

        // ② 通知后端：我准备好了
        vscode.postMessage({ kind: "ready" });
    </script>
</body>

</html>
