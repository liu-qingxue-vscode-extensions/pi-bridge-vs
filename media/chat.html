<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  CSP（内容安全策略）：
    default-src 'none'       —— 默认禁止一切外部资源
    style-src {{cspSource}} 'unsafe-inline'  —— 允许 VS Code 注入的样式 + 内联 <style>
    script-src 'nonce-{{nonce}}'             —— 只允许带本次 nonce 的脚本执行
  {{nonce}} / {{cspSource}} 由扩展在加载时注入（html-loader.ts）
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size);
    color: var(--vscode-editor-foreground);
    background: var(--vscode-sideBar-background);
  }
  /* 消息区：第一步先空着，数据在调试板里看 */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  #input-area {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--vscode-panel-border);
    background: var(--vscode-sideBar-background);
  }
  #input {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--vscode-input-border);
    background: var(--vscode-input-background);
    color: var(--vscode-input-foreground);
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    resize: none;
    outline: none;
  }
  #input:focus { border-color: var(--vscode-focusBorder); }
  #send {
    padding: 6px 16px;
    background: var(--vscode-button-background);
    color: var(--vscode-button-foreground);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
  }
  #send:hover { background: var(--vscode-button-hoverBackground); }
</style>
</head>
<body>
  <div id="messages"></div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="输入 prompt... (Enter 发送, Shift+Enter 换行)"></textarea>
    <button id="send">发送</button>
  </div>

  <script nonce="{{nonce}}">
    const vscode = acquireVsCodeApi();
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    // ===== 发送：前端 -> 扩展宿主 =====
    function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      vscode.postMessage({ kind: "prompt", text });
      inputEl.value = "";
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // ===== 接收：扩展宿主 -> 前端 =====
    // 第一步先不做渲染（数据在调试板看）；
    // 第二步开始按 msg.kind 逐个长出 UI：
    //   case "pi": ...    case "system": ...    case "error": ...
    window.addEventListener("message", (event) => {
      console.log("[chat] 收到:", event.data);
    });
  </script>
</body>
</html>
