<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- CSP 同 chat.html：脚本只认本次 nonce -->

      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src {{cspSource}} 'nonce-{{nonce}}'; img-src *;">
<link rel="stylesheet" href="{{css}}">
</head>
<body>
  <div id="toolbar">
    <button id="clear">清空</button>
    <button id="export">导出 JSON</button>
    <span id="count">0 条</span>
  </div>
  <div id="log"></div>

  <script nonce="{{nonce}}" src="{{js}}"></script>
</body>
</html>
